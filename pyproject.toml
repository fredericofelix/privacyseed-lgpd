[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "privacyseed-lgpd"
dynamic = ["version"]
description = "Detect and anonymize personal data (LGPD) in Brazilian Portuguese text."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Privacy Seed" }]
keywords = ["lgpd", "pii", "anonymization", "privacy", "portuguese", "gliner"]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
ml = ["gliner2[local]>=2.1,<3", "huggingface_hub>=0.24,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "build>=1,<2"]

[project.urls]
Homepage = "https://github.com/fredericofelix/privacyseed-lgpd"

[tool.hatch.version]
path = "src/privacyseed_lgpd/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/privacyseed_lgpd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "space"]
markers = ["ml: needs the [ml] extra and the model download"]
addopts = "-m 'not ml'"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
